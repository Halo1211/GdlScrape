[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gdlscrape"
version = "1.0.3"
description = "A visual gallery download manager powered by gallery-dl."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "gallery-dl>=1.32.14",
  "keyring>=25.0",
  "openpyxl>=3.1",
  "Pillow>=12.3.0",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/Halo1211/GdlScrape"
Repository = "https://github.com/Halo1211/GdlScrape.git"
Issues = "https://github.com/Halo1211/GdlScrape/issues"
Changelog = "https://github.com/Halo1211/GdlScrape/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pyinstaller>=6.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.gui-scripts]
gdlscrape = "gallery_dl_app.application:main"

[tool.setuptools]
py-modules = ["gdlscrape"]

[tool.setuptools.packages.find]
include = ["gallery_dl_app*"]

[tool.setuptools.package-data]
gallery_dl_app = ["assets/*.png", "assets/*.json", "assets/config-examples/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
